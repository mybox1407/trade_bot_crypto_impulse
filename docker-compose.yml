services:
  trade_bot:
    build: .
    container_name: lighter_bot
    restart: unless-stopped
    ports:
      - "3006:3006"

    environment:
      - PORT=3006
      - NODE_ENV=production

      - LIGHTER_API_KEY=${LIGHTER_API_KEY:-}
      - LIGHTER_API_SECRET=${LIGHTER_API_SECRET:-}
      - LIGHTER_API_KEY_INDEX=${LIGHTER_API_KEY_INDEX:-0}
      - LIGHTER_ACCOUNT_INDEX=${LIGHTER_ACCOUNT_INDEX:-0}
      - LIGHTER_API_URL=${LIGHTER_API_URL:-https://mainnet.zklighter.elliot.ai}

      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}

    volumes:
      - ./logs:/app/logs

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3006/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
